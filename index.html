<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Departures</title>
    <link rel="icon" type="image/x-icon" href="static/favicon.ico">
    <style>
        :root {
            --bg: #000000;
            --card: #0f0f0f;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --line: #334155;
            --ok: #10b981;
            --late: #ef4444;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 14px;
        }

        .container {
            max-width: 1260px;
            margin: 0 auto;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
        }

        h1 {
            margin: 0;
            padding: 16px 20px;
            font-size: 1.25rem;
            border-bottom: 1px solid var(--line);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px 14px;
            border-bottom: 1px solid var(--line);
            text-align: left;
            font-size: 0.95rem;
            vertical-align: top;
        }

        th {
            color: var(--muted);
            font-weight: 600;
            background: #0f172a;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .on-time {
            color: var(--ok);
            font-weight: 600;
        }

        .delayed {
            color: var(--late);
            font-weight: 600;
        }
    </style>
</head>

<!-- TODO design -->
<!-- TODO fix column widths, make sure there are no unwanted linebreaks -->

<body>
    <main class="container">
        <h1 id="current-time" style="text-align: center; font-size: xx-large;"></h1>
        <script>
            function updateTime() {
                document.getElementById('current-time').textContent = new Date().toLocaleTimeString();
            }
            updateTime();
            setInterval(updateTime, 1000);
        </script>
        <table>
            <!-- <thead>
                <tr>
                    <th>Linie</th>
                    <th>Nach</th>
                    <th>Von</th>
                    <th>In</th>
                    <th>Um</th>
                    <th>Hält bei</th>
                </tr>
            </thead> -->
            <tbody id="departures-body"></tbody>
        </table>
    </main>

    <script>
        function refreshTable() {
            fetch('/get_departures')
                .then(response => response.json())
                .then(departures => {
                    console.log("Received departures:", departures);

                    const tbody = document.getElementById("departures-body");
                    tbody.innerHTML = ""; // Clear existing rows

                    departures.forEach((departure) => {
                        const row = document.createElement("tr");
                        const isDelayed = departure.delay > 0;

                        row.innerHTML = `
                        <td style="background: #${departure.color.bg}; color: #${departure.color.fg};">${departure.name}</td>
                        <td>${departure.direction}<span style="color: #ef4444;">${departure.messages.length > 0 ? " &#128712;" : ""}</span></td>
                        <td>${departure.station + " (" + departure.track + ") "}</td>
                        <td>${departure.time_to_departure > 0 ? departure.time_to_departure : "Jetzt"}</td>                    
                        <td class="${isDelayed ? "delayed" : "on-time"}">${`${departure.scheduled_time.slice(0, 5)}${isDelayed ? " (+" + departure.delay + ")" : ""}`}</td>
                        <td>${Object.keys(departure.stops_at).length > 0 ? Object.entries(departure.stops_at).map(([stop, times]) => `${stop} (${times.arrival_time.slice(0, 5)})${times.delay ? " (+" + times.delay + ")" : ""}`).join("<br>") : ""}</td>
                        </tr>`;

                        tbody.appendChild(row);

                        // for (const message of departure.messages) {
                        //     const messageRow = document.createElement("tr");
                        //     messageRow.innerHTML = `<td colspan="7" style="color: var(--muted); font-size: 0.9rem; font-style: italic;">${departure.name}: ${message}</td>`;
                        //     tbody.appendChild(messageRow);
                        // }
                    });
                })
                .catch(error => console.error('Error fetching departures:', error));
        }
        // Initial call to populate the table
        window.onload = function () {
            refreshTable();
        };

        // Refresh the table every 30 seconds
        setInterval(refreshTable, 30000);
    </script>
</body>

</html>
